document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = 'Deriving key…';
  const pw = document.getElementById('pw').value;
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64(PAYLOAD.s), iterations: 600000, hash: 'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(PAYLOAD.n) }, key, b64(PAYLOAD.c));
    document.getElementById('content').innerHTML = new TextDecoder().decode(pt);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (_) {
    err.textContent = 'That passphrase did not work.';
  }
});
