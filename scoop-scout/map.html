</head>
<body class="bg-background font-body-md text-on-background">

</div>

<script>
(function () {
'use strict';

/* Schedule data + current-stop computation live in js/schedule.js (shared
   with checkout.html). */
var SCHEDULE = ScoopSchedule.SCHEDULE;
var truckState = ScoopSchedule.truckState;
var nowMinutes = ScoopSchedule.nowMinutes;
var fmt = ScoopSchedule.fmt;
var countdown = ScoopSchedule.countdown;

var SHOPS = [
  { name: "Kate's #1 — Scoop Shop", lat: 45.5504, lng: -122.6755, address: '3713 N Mississippi Ave, Portland, OR 97227', phone: '(503) 249-9640' },
  { name: "Kate's #2 — Scoop Shop", lat: 45.5338, lng: -122.6986, address: '1430 NW 23rd Ave, Portland, OR 97210', phone: '(971) 339-2138' }
];

function truckLatLng(state) {
  if (state.parked) return [state.parked.lat, state.parked.lng];
  var t = state.transit;
  return [t.from.lat + (t.to.lat - t.from.lat) * t.progress,
          t.from.lng + (t.to.lng - t.from.lng) * t.progress];
}

/* ---------- Map ---------- */
var map = L.map('map', { zoomControl: false }).setView([45.553, -122.665], 13);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

SHOPS.forEach(function (s) {
  L.marker([s.lat, s.lng], {
    icon: L.divIcon({
      className: '',
      html: '<div class="shop-marker"><span class="material-symbols-outlined">storefront</span></div>',
      iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -20]
    })
  }).addTo(map).bindPopup(
    '<b>' + s.name + '</b><br>' + s.address + '<br>' + s.phone +
    '<br>Open every day, 12&ndash;10PM<br><a href="menu.html">View menu &rarr;</a>'
  );
});

var truckMarker = L.marker([45.5508, -122.6757], {
  icon: L.divIcon({
    className: '',
    html: '<div class="truck-marker">🍦</div>',
    iconSize: [46, 46], iconAnchor: [23, 23], popupAnchor: [0, -26]
  }),
  zIndexOffset: 1000
}).addTo(map);

var routeLine = L.polyline([], {
  color: '#031f41', weight: 3, opacity: 0.5, dashArray: '6 8'
}).addTo(map);

/* ---------- Render (every 30s; pure function of the clock) ---------- */
function render() {
  var m = nowMinutes();
  var state = truckState(m);
  var pos = truckLatLng(state);
  var next = state.next;
  var nextAt = fmt(next.start);

  truckMarker.setLatLng(pos);
  routeLine.setLatLngs([pos, [next.lat, next.lng]]);

  var statusEl = document.getElementById('truck-status');
  var subEl = document.getElementById('truck-sub');
  var nextEl = document.getElementById('truck-next');

  if (state.parked && state.overnight) {
    statusEl.textContent = 'Overnight at ' + state.parked.name;
    subEl.textContent = 'The truck is parked for the night — first scoops tomorrow.';
    nextEl.textContent = 'Next: ' + next.name + ' at ' + nextAt;
    truckMarker.bindPopup('<b>Scoop Scout Truck</b><br>Overnight at ' + state.parked.name +
      '<br>First stop: ' + next.name + ' at ' + nextAt);
  } else if (state.parked) {
    statusEl.textContent = 'Parked at ' + state.parked.name;
    subEl.textContent = state.parked.note + ' — here until ' + fmt(state.parked.end) + '.';
    nextEl.textContent = 'Next: ' + next.name + ' at ' + nextAt + ' (' + countdown(m, next.start) + ')';
    truckMarker.bindPopup('<b>Scoop Scout Truck</b><br>Parked at ' + state.parked.name +
      ' until ' + fmt(state.parked.end) + '<br>Next: ' + next.name + ' at ' + nextAt);
  } else {
    statusEl.textContent = 'On the move to ' + state.transit.to.name;
    subEl.textContent = 'Just wrapped ' + state.transit.from.name + ' — rolling to the next stop.';
    nextEl.textContent = 'Arrives ' + nextAt + ' (' + countdown(m, next.start) + ')';
    truckMarker.bindPopup('<b>Scoop Scout Truck</b><br>On the move to ' + state.transit.to.name +
      '<br>Arrives ' + nextAt);
  }

  // Today's schedule: past greyed out, current highlighted, upcoming with windows.
  var list = document.getElementById('schedule-list');
  list.innerHTML = '';
  SCHEDULE.forEach(function (s) {
    var isCurrent = state.parked === s && !state.overnight;
    var isPast = !isCurrent && m >= s.end;
    var li = document.createElement('li');
    li.className = 'flex items-center justify-between gap-2 px-2 py-2 rounded-lg ' +
      (isCurrent ? 'bg-primary-fixed text-on-primary-fixed' : isPast ? 'opacity-45' : '');
    li.innerHTML =
      '<div class="min-w-0"><p class="font-label-lg text-[13px] font-bold truncate">' + s.name + '</p>' +
      '<p class="text-[11px]' + (isCurrent ? '' : ' text-on-surface-variant') + '">' +
      fmt(s.start) + ' &ndash; ' + fmt(s.end) + '</p></div>' +
      (isCurrent ? '<span class="text-[10px] font-bold uppercase tracking-widest whitespace-nowrap">Here now</span>' :
       isPast ? '<span class="material-symbols-outlined text-[16px]">check</span>' : '');
    list.appendChild(li);
  });
}

render();
setInterval(render, 30000);

// Frame the action: truck, all stops, and both shops.
var bounds = L.latLngBounds([truckLatLng(truckState(nowMinutes()))]);
SCHEDULE.forEach(function (s) { bounds.extend([s.lat, s.lng]); });
SHOPS.forEach(function (s) { bounds.extend([s.lat, s.lng]); });
map.fitBounds(bounds, { padding: [40, 40] });

document.getElementById('status-toggle').addEventListener('click', function () {
  var panel = document.getElementById('schedule-panel');
  var nowHidden = panel.classList.toggle('hidden');
  this.setAttribute('aria-expanded', String(!nowHidden));
  document.getElementById('chevron').textContent = nowHidden ? 'expand_less' : 'expand_more';
});
})();
</script>
</body></html>
